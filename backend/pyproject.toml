[project]
name = "leventum"
version = "0.1.0"
description = "Leventum Property Management (Rent-to-Rent)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "cryptography>=42",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0", "httpx>=0.27"]  # httpx: Demo-Seeding (fastapi.testclient)
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["leventum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
